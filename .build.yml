image: nixos/latest
repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable
sources:
  - https://git.sr.ht/~dannypsnl/parsec-extra
tasks:
  - install-elan: |
      nix-env -iA nixpkgs.elan
  - setup-toolchain: |
      elan default stable
  - build: |
      lake update
      lake build
  - test: |
      lake exe lspec
